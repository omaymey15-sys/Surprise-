name: Importer le projet
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser Surprise.zip
        run: |
          unzip -o Surprise.zip
          cp -a Surprise/. .
          rm -rf Surprise Surprise.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Import du projet" || echo "rien à commiter"
          git push
